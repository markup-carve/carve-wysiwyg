name: Pins

# Runs on every pull request so the check always reports and can be required;
# the pin check itself only runs when a pin file changed.
on:
  pull_request:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did this pull request touch a pin
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -qxE 'package\.json|package-lock\.json|scripts/check-carve-pins\.mjs|\.github/workflows/pins\.yml'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No pin file changed; nothing to check."
          fi

      - uses: actions/setup-node@v7
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 22

      # Fails on what this repo controls: lockfile agreement, merged grammar and
      # engine commits, grammar and engine spec revisions. Upstream moving ahead is only
      # a warning here; engine-drift.yml files that as a ticket.
      - name: Check the Carve dependency pins
        if: steps.changed.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-carve-pins.mjs
