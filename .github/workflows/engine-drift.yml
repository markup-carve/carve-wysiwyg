name: Engine drift

on:
  schedule:
    - cron: "0 5 * * *"
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - scripts/check-carve-pins.mjs
      - .github/workflows/engine-drift.yml
  workflow_dispatch:

jobs:
  pin-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Reads package.json and package-lock.json only, over the public GitHub
      # API: the grammar pin has to name a merged commit, the lockfile has to
      # agree with it, and the grammar may not be older than the spec revision
      # the installed engine was built against. See the script header for why
      # the previous declared-versus-locked string comparison never got past
      # its first dependency.
      - name: Check the Carve dependency pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-carve-pins.mjs
