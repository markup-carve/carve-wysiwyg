name: Engine drift

# Scheduled, not per pull request: "upstream moved" is not a failure of a pull
# request's change. The pull-request gate for the pins is pins.yml.
# A drift verdict files a ticket and the run stays green; a broken check is red.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One group across triggers: two reporters at once could file duplicate tickets.
concurrency:
  group: engine-drift-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pin-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # --drift exits 3 on upstream movement alone; any other non-zero exit is
      # the check itself failing, and only that turns the run red.
      - name: Check the Carve dependency pins against upstream
        id: measure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          node scripts/check-carve-pins.mjs --drift 2>&1 | tee /tmp/pin-drift.txt && status=0 || status=$?
          case "$status" in
            0) verdict=clean ;;
            3) verdict=drift ;;
            *) verdict=broken ;;
          esac
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo '## Carve dependency pins'
            echo
            echo '```text'
            cat /tmp/pin-drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$verdict" = broken ]; then
            echo "::error::the pin check exited $status, so it could not measure drift."
            exit 1
          fi

      # One tracking issue, opened by the first drift verdict, edited by later
      # ones, closed by the first clean run. Fails if it cannot file.
      - name: File the verdict where someone reads it
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.measure.outputs.verdict }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Pin drift tickets are scoped to $DEFAULT_BRANCH; $REF_NAME keeps its Actions verdict only."
            exit 0
          fi

          TITLE="The Carve dependency pins are behind upstream"
          MARKER="<!-- pin-drift-verdict ref=$REF_NAME -->"

          # Listed rather than searched: the search index lags a fresh issue.
          open_issues="$(gh api "repos/$REPO/issues?state=open&per_page=100" --paginate \
            | jq -r --arg m "$MARKER" \
                '.[] | select(.pull_request == null) | select((.body // "") | contains($m)) | .number')"
          issue="${open_issues%%$'\n'*}"

          case "${VERDICT:-}" in
            clean|drift) ;;
            *)
              echo "No verdict to file: the measure step failed, and the run stays red."
              exit 0
              ;;
          esac

          if [ "$VERDICT" = clean ]; then
            echo "The pins are current on $HEAD_SHA."
            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$REPO" --body \
                "Clean again: run $RUN_URL on \`$HEAD_SHA\`. Closing. The next drift verdict opens a fresh ticket rather than reopening this one."
              gh issue close "$issue" --repo "$REPO"
              echo "Closed #$issue."
            fi
            exit 0
          fi

          {
            echo "$MARKER"
            echo
            echo "\`scripts/check-carve-pins.mjs --drift\` reports that the Carve dependency"
            echo "pins on \`$DEFAULT_BRANCH\` trail upstream or no longer agree with it."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| run | $RUN_URL |"
            echo "| commit | \`$HEAD_SHA\` |"
            echo "| trigger | \`$EVENT_NAME\` |"
            echo
            echo "### What it reported"
            echo
            echo '```text'
            cat /tmp/pin-drift.txt
            echo '```'
            echo
            echo "### How to clear it"
            echo
            echo "Bump the pin the report names in package.json, run \`npm install\`, and open"
            echo "a pull request. A finding that names carve-grammars as the repository that"
            echo "can close the gap is fixed there first. Reproduce locally with"
            echo "\`node scripts/check-carve-pins.mjs --drift\`."
            echo
            echo "This ticket is filed and maintained by the workflow. It is EDITED by each"
            echo "later drift verdict and CLOSED by the first clean run. Closing it by hand"
            echo "does not silence it: the next drift verdict files a new one."
          } > /tmp/pin-drift-verdict.md

          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file /tmp/pin-drift-verdict.md
            echo "Updated #$issue."
          else
            url="$(gh issue create --repo "$REPO" --title "$TITLE" \
              --body-file /tmp/pin-drift-verdict.md)"
            echo "Filed $url."
          fi
