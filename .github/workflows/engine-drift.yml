name: Engine drift

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  registry-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Compare declared Carve packages with the registry
        run: |
          set -euo pipefail

          check() {
            local pkg="$1" declared locked latest
            declared="$(node -p "require('./package.json').dependencies['${pkg}'] || ''")"
            locked="$(node -p "require('./package-lock.json').packages['node_modules/${pkg}']?.version || ''")"
            latest="$(npm view "${pkg}" version 2>/dev/null | tr -d "'\"")"

            if [ -z "${declared}" ] || [ -z "${locked}" ] || [ -z "${latest}" ]; then
              echo "::error::${pkg}: declared=${declared:-missing}, locked=${locked:-missing}, latest=${latest:-missing}"
              exit 1
            fi
            if [ "${declared}" != "${locked}" ]; then
              echo "::error::${pkg}: package.json declares ${declared}, lockfile installs ${locked}"
              exit 1
            fi

            echo "${pkg}: declared and locked at ${declared}; registry latest is ${latest}"
            if [ "${locked}" != "${latest}" ]; then
              echo "::warning::${pkg} ${latest} is published, but this editor is pinned to ${locked}"
            fi
          }

          check '@markup-carve/carve'
          check '@markup-carve/carve-grammars'
